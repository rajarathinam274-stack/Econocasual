name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[test]"
      - name: Run tests
        env:
          PYTHONPATH: src:.
        run: pytest -q
      - name: Run reproducibility smoke pipeline
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/reproducibility_smoke.py tests/fixtures/smoke_transactions.csv --output-dir outputs/ci-smoke
          python - <<'PY'
          import json
          report = json.load(open('outputs/ci-smoke/manifest.json', encoding='utf-8'))
          assert report['raw_rows'] == 5
          assert report['positive_sales_rows'] == 4
          assert report['scenario_rows'] == 4
          assert report['eda_revenue'] == 29.0
          PY
