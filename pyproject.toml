[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "econocausal"
version = "0.1.0"
description = "Reproducible, scientifically cautious price-demand analysis tools"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.5,<2.0",
  "statsmodels>=0.14,<1.0",
  "openpyxl>=3.1,<4.0",
  "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
